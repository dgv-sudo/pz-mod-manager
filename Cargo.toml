[workspace]
members = ["crates/core", "crates/cli", "app/src-tauri"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "1.5.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dgv-sudo/pz-mod-manager"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
